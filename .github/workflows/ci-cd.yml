name: CI/CD Pipeline & Auto Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    name: 🔍 Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Typecheck
        run: bunx tsc --noEmit

  deploy:
    name: 🚀 Auto Deploy to Server
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "----------------------------------------"
            echo "📥 Pulling latest code from GitHub..."
            cd ${{ secrets.SERVER_PATH || '~/wagate' }}
            git pull origin main

            echo "📦 Installing dependencies..."
            bun install

            echo "🔄 Restarting Wagate Service..."
            if command -v pm2 &> /dev/null; then
              pm2 restart wagate || pm2 start ecosystem.config.cjs
            elif [ -f docker-compose.yml ]; then
              docker compose down && docker compose up -d --build
            else
              echo "⚠️ Please ensure PM2 or Docker is configured on the server"
            fi

            echo "✅ Deployment completed successfully!"
            echo "----------------------------------------"
