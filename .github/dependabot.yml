version: 2
updates:
  # Keep GitHub Actions (checkout, setup-bun, docker/*) up to date
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
